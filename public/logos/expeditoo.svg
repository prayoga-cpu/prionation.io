<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 120" role="img" aria-label="Expeditoo">
  <!-- Mark from expeditoo-ship/public/logo.svg; the inner disc is a mask hole so
       the chevron survives the white-silhouette filter used in the logo rows. -->
  <defs>
    <mask id="hole">
      <rect width="120" height="120" fill="#fff"/>
      <circle cx="60" cy="60" r="32" fill="#000"/>
    </mask>
  </defs>
  <rect width="120" height="120" rx="34" fill="#0052FF" mask="url(#hole)"/>
  <path d="M53 46 L68 60 L53 74" stroke="#0052FF" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="82" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" textLength="362" lengthAdjust="spacingAndGlyphs" fill="#111">EXPEDITOO</text>
</svg>
